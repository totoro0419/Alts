5px;padding:9px 14px;font-weight:800;font-size:12px;color:var(--muted)}.study-switch button.active{background:var(--blue);border-color:var(--blue);color:#fff}.poem-head{margin-top:10px}.poem-head h2{font-size:25px;margin:6px 0}.poem-head p{margin:0;color:var(--muted);font-size:13px}.blurb{line-height:1.95;font-size:14px;padding:16px 18px;background:#f2f6ff;border-radius:14px;margin-top:15px}.verse-list{display:grid;gap:10px;margin-top:17px}.verse{border:1px solid var(--line);border-radius:17px;background:#fff;padding:18px}.verse.open{border-color:#c3d2ff}.verse-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.verse-no{font-size:10px;font-weight:900;letter-spacing:.1em;color:#a0acc0}.kanbun{font-family:"Noto Serif CJK JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,3.4vw,28px);font-weight:650;letter-spacing:.08em;line-height:1.8;margin:10px 0 12px;overflow-wrap:anywhere}.answer{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);animation:fade .2s ease}.answer-label{font-size:10px;font-weight:900;letter-spacing:.13em;color:var(--muted);margin-bottom:6px}.kakikudashi{font-size:17px;font-weight:800;line-height:1.8;margin:0 0 16px}.reading{font-size:14px;line-height:1.85;margin:0 0 15px}.translation{background:#f7f9fd;border-radius:12px;padding:14px;line-height:1.85;font-size:13px;margin-bottom:14px}.plain{font-size:13px;line-height:1.8;color:#344462}.answer-grid{display:grid;gap:4px}.verse-actions{margin-top:13px}.mono{font-variant-numeric:tabular-nums}.divider{height:1px;background:var(--line);margin:18px 0}.test-card{padding:28px;background:white;border-radius:22px;border:1px solid var(--line);max-width:720px}.prompt-title{color:#7988a3;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850}.test-kanbun{text-align:center;padding:24px 5px;font-family:"Noto Serif CJK JP","Yu Mincho",serif;font-size:clamp(25px,4vw,36px);line-height:1.6}.test-answer{background:#f0f4ff;padding:18px;border-radius:13px;line-height:2}.listline{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);line-height:1.7;font-size:13px}.listline:last-child{border:0}.bullet{background:#dce7ff;color:#315dec;border-radius:8px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:900;font-size:11px}.span{color:var(--muted)}.link{background:none;border:0;color:var(--blue);padding:0;font-weight:850}.top-mobile{display:none}.hidden{display:none!important}@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:780px){.shell{display:block}.sidebar{display:none}.main{padding:22px 17px 98px}.top-mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:8;justify-content:space-around;padding:8px 3px max(8px,env(safe-area-inset-bottom))}.top-mobile button{background:none;border:0;padding:6px;color:#71809b;font-size:11px;font-weight:850;min-width:20%}.top-mobile button.active{color:var(--blue)}.top-mobile span{display:block;font-size:20px;margin-bottom:3px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cards .card:nth-child(3){grid-column:span 2}.lesson-grid{grid-template-columns:1fr}.card{padding:17px}.study-panel{max-width:100%}.kanbun{font-size:24px}.verse{padding:16px}.page-title{font-size:29px}.test-card{padding:20px}}@media print{.sidebar,.top-mobile,.btn,.topline .pill,.study-switch,.verse-top button{display:none!important}.shell{display:block}.main{padding:0}.verse .answer{display:block!important}.card,.lesson,.verse{break-inside:avoid}body{background:#fff}.main{max-width:100%}}

// 学校の原本が未提供のため、詩句は外部の古典本文を参考にした暫定版。
// 書き下し・送り仮名・異体字・校訂は授業資料の到着後に確定させる。
const poems=[
{id:"wang",title:"九月九日憶山東兄弟",author:"王維",form:"七言絶句",topic:"故郷を離れた自分が、重陽の節句を祝う家族を想像する。最後の「一人足りない」は作者自身。",tip:"転句で故郷の兄弟へ視点が移る。「親」は肉親、茱萸は重陽の節句に用いられる植物。",source:"https://zh.wikisource.org/wiki/九月九日憶山東兄弟",lines:[
["独在異郷為異客","独り異郷に在りて異客と為る","ひとりいきょうにありていかくとなる","自分だけが故郷を離れ、よその土地に暮らしている。","「異」を繰り返して、故郷から離れた境遇を示す。"],
["毎逢佳節倍思親","佳節に逢ふ毎に倍親を思ふ","かせつにあうごとにますますしんをおもう","祝いの日が来るたびに、家族がいっそう恋しくなる。","佳節はここでは九月九日の重陽の節句。"],
["遥知兄弟登高処","遥かに知る兄弟高きに登る処","はるかにしるけいていたかきにのぼるところ","遠い故郷で、兄弟たちが高い所に登っている様子を思い浮かべる。","「知」はその場を見たのではなく、想像している。"],
["遍挿茱萸少一人","遍く茱萸を挿して一人を少く","あまねくしゅゆをさしていちにんをかく","皆が茱萸を身につけて集まるが、自分だけがそこにいない。","少一人＝欠けている一人は作者自身。"]
]},
{id:"du",title:"登高",author:"杜甫",form:"七言律詩",topic:"秋の高台から厳しい自然を眺め、遠く故郷を離れた身や病気、人生の苦難を重ねて嘆く。",tip:"前半四句は景色、後半四句は作者の境遇と嘆き。八句・七言の律詩で、対句の確認が重要。",source:"https://zh.wikisource.org/wiki/登高",lines:[
["風急天高猿嘯哀","風急に天高くして猿嘯哀し","かぜきゅうにてんたかくしてえんしょうかなし","風は激しく、空は高い。猿の声は物悲しい。","風・天・猿の音と景色が秋の寂しさをつくる。"],
["渚清沙白鳥飛回","渚清く沙白くして鳥飛び回る","なぎさきよくすなしろくしてとりとびめぐる","水辺は澄み、砂は白く、鳥が旋回している。","渚・沙・鳥が対照的な景色をつくる。"],
["無辺落木蕭蕭下","無辺の落木蕭蕭として下り","むへんのらくぼくしょうしょうとしてくだり","見渡す限り、落ち葉が寂しい音を立てて散り続ける。","蕭蕭は落葉の寂しい様子・音を表す。"],
["不尽長江滾滾来","不尽の長江滾滾として来たる","ふじんのちょうこうこんこんとしてきたる","長江は尽きることなく、勢いよく流れてくる。","「無辺」と「不尽」、「蕭蕭」と「滾滾」が対応する。"],
["万里悲秋常作客","万里悲秋常に客と作り","ばんりひしゅうつねにかくとなり","故郷から遠く離れ、秋を悲しみながら長く旅暮らしをしている。","「客」は旅先に身を寄せる人。"],
["百年多病独登台","百年多病独り台に登る","ひゃくねんたびょうひとりだいにのぼる","年を重ね病気も多い身で、一人高台に登っている。","百年は人生・老境を示す表現。"],
["艱難苦恨繁霜鬢","艱難苦だ恨む霜鬢の繁きを","かんなんはなはだうらむそうびんのしげきを","苦難が重なり、白髪が増えてしまったことをつらく思う。","霜鬢＝霜のように白いもみあげ・髪。"],
["潦倒新停濁酒杯","潦倒新たに停む濁酒の杯","ろうとうあらたにとどむだくしゅのはい","落ちぶれた身で、病気のため酒までやめることになった。","最後まで苦境が重なる。"]
]},
{id:"li",title:"秋浦歌 其十五",author:"李白",form:"五言絶句",topic:"愁いの深さを、白髪が三千丈にも伸びたという大げさな表現で描く。",tip:"授業プリントで第十五首と確認。「白髪三千丈」の誇張と「秋霜」の比喩を押さえる。",source:"https://zh.wikisource.org/wiki/秋浦歌",lines:[
["白髪三千丈","白髪三千丈","はくはつさんぜんじょう","白髪が三千丈もあるというほど、深く悩んでいる。","三千丈は実際の長さではなく誇張表現。"],
["縁愁似箇長","愁ひに縁りて箇くの似く長し","うれいによりてかくのごとくながし","苦しい思いのせいで、こんなにも白髪が長くなったのだ。","「縁」＝〜によって。「箇く」＝このように。"],
["不知明鏡裏","知らず明鏡の裏","しらずめいきょうのうち","鏡に映る自分の姿を見て、思わず不思議に感じる。","「不知」は「知らず」。"],
["何処得秋霜","何れの処よりか秋霜を得たる","いずれのところよりかしゅうそうをえたる","いったいどこで、霜のような白髪を得てしまったのだろう。","秋霜＝白髪の比喩。文献に字句の異同がある。"]
]},
{id:"ryu",title:"秋風引",author:"劉禹錫",form:"五言絶句",topic:"秋風は誰にも届くはずなのに、寂しく故郷を離れている自分が真っ先にその音を感じ取る。",tip:"作者の孤独が、秋風に敏感な感覚として表現される。",source:"https://zh.wikisource.org/wiki/秋風引_(劉禹錫)",lines:[
["何処秋風至","何れの処よりか秋風至る","いずれのところよりかしゅうふういたる","秋風はいったいどこから吹いてくるのか。","何処〜＝どこから・どこに、という疑問。"],
["蕭蕭送雁群","蕭蕭として雁群を送る","しょうしょうとしてがんぐんをおくる","物寂しい音を立てながら、雁の群れを送り渡す。","蕭蕭は秋風の寂しい音。"],
["朝来入庭樹","朝来庭樹に入り","ちょうらいていじゅにいり","朝になると秋風は庭の木々の間に吹き込んでくる。","庭樹は庭の木。"],
["孤客最先聞","孤客最も先に聞く","こかくもっともさきにきく","故郷を離れた孤独な旅人が、誰より先に風音を聞く。","孤客とは故郷を離れた作者の境遇を表す。"]
]},
{id:"bai",title:"燕子楼 其一",author:"白居易",form:"七言絶句",topic:"燕子楼で一人暮らす女性の孤独な秋の長い夜を、その冷たさと時間の長さから描く。",tip:"「満窗（窓）」と「満床」など底本による字句の異同がある。学校教材の表記を優先。",source:"https://zh.wikisource.org/wiki/燕子樓三首",lines:[
["満窓明月満簾霜","満窓の明月満簾の霜","まんそうのめいげつまんれんのしも","窓からは月光、すだれの周りには霜。冷え切った秋の夜。","異本に「満床明月」がある。学校教材で必ず照合。"],
["被冷灯残払臥床","被冷ややかに灯残りて臥床を払ふ","ふすまひややかにともしびのこりてがしょうをはらう","掛け布団は冷え、灯火は消えかかる。床を整えて一人で眠ろうとする。","冷たさと灯火の弱さで孤独を際立たせる。"],
["燕子楼中霜月夜","燕子楼中霜月の夜","えんしろうちゅうそうげつのよる","燕子楼にいる、霜が降り月が照る寒い夜。","場所と夜の情景を改めて強調。"],
["秋来只為一人長","秋来たりて只一人の為に長し","あききたりてただいちにんのためにながし","秋の夜は、この孤独な一人にとってとりわけ長く感じられる。","実際の夜の長さ以上に、孤独による主観的な長さを示す。"]
]}
];
poems.push(...window.KANBUN_SUPPLEMENT);
const scope=[
["『史記会注考証』5頁1行〜6頁4行","『史記』項羽本紀／本文23まとまり。"],
["王維・杜甫・李白・劉禹錫・白居易の漢詩5作品","本文24句、読み、情景と心情。"],
["『体系漢文法演習』第12項","三人成虎／前置詞の基本。"],
["『体系漢文法演習』第13項","『韓非子』の嫁女・買櫝還珠／前置詞の後置。"],
["『体系漢文法演習』第14項","呂尚と西伯／前置詞の省略。"],
["『体系漢文法演習』第15項","『顔氏家訓』勉学／前置詞句の省略。"],
["『体系漢文法演習』第16項","田過と斉宣王／接続詞の基本。"],
["『体系漢文法演習』第17項","郭翻の逸話／接続詞の応用。"],
["右下・左下コラムと授業知識","『重要知識』へ文法と理解の要点を独自要約。"],
["初見問題（少量）","重要句形と基礎文法の一問一答から応用確認。"]
];
const columns=[
{n:12,name:"前置詞①｜基本",left:"『於・于・乎』は場所・対象・比較、『自・従・由』は起点、『以』は手段・理由、『為』は対象や目的、『与』は共同などを示す。文脈で訳し分ける。",right:"前置詞＋名詞は述語との関係を示す。『於邯鄲』は邯鄲に、『遠於市』は市より。『以枝叩其扉』なら枝を以て其の扉を叩く。",page:"26〜27頁"},
{n:13,name:"前置詞②｜後置",left:"前置詞句『於B』『以B』が述語の後ろに置かれる場合がある。『売其珠於鄭』＝珠を鄭に売る。『薫以桂椒』＝薫ずるに桂椒を以てす。",right:"句の位置が後ろになっても場所・手段の役割は変わらない。『嫁女』『売珠』の共通点は、飾りが本体の魅力を隠したこと。",page:"28〜29頁"},
{n:14,name:"前置詞③｜省略",left:"『於・自・以・為』などは前後から意味が明らかな場合に省略される。『遇呂尚渭水之陽』には場所の『於』を補って理解する。",right:"『与語』は共に語る。『号之曰太公望』は名づけて〜という。後置や省略があっても元の構造を復元する。",page:"30〜31頁"},
{n:15,name:"前置詞④｜述部の省略",left:"『所以』は〜するためのもの・理由。『夫学者所以求益耳』は学ぶ目的を示す。",right:"前置詞句がかかる述語が省かれる場合がある。『古之学者為己』と『今之学者為己』の対比、春華と秋実の比喩も確認。",page:"32〜33頁"},
{n:16,name:"接続詞①｜基本",left:"『而』は順接・並列・逆接を文脈で訳す。『然』はそのように・しかし。『乃』はそこで、『因』はそれによって、など。",right:"前後の論理関係で訳を判断。『孰』はどちらか、『無以〜』は〜する手段がない。田過の答えは君への奉仕が親のためであることを示す。",page:"34〜35頁"},
{n:17,name:"接続詞②｜複文",left:"『若』はもし〜ならば、『乃』はそこで、『因』はそれによって。前節と後節の条件・順接・逆接を読み取る。",right:"『我若取此、将為天地鬼神所責』は条件＋受身。『為A所B』は受身、『我豈能得』は反語。話者の交替に注意。",page:"36〜37頁"}
];
const KEY="alts-kanbun-study-v1";
function readState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
let state=readState();
if(!state.scores)state.scores={};
if(!state.factScores)state.factScores={};
let nav="home",current=poems[0].id,mode="study",testQueue=[],testIndex=0,revealed=false,studyRevealed={},factQueue=[],factIndex=0,factRevealed=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}} 
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const items=()=>poems.flatMap(p=>p.lines.map((l,i)=>({p,i,l,key:p.id+"-"+i})));
const status=(key)=>state.scores[key]||0;
function metrics(){const a=items();return{all:a.length,known:a.filter(x=>status(x.key)===2).length,review:a.filter(x=>status(x.key)===1).length,untouched:a.filter(x=>status(x.key)===0).length};}
function button(text,action,style){return '<button class="btn '+(style||"")+'" data-act="'+escapeHTML(action)+'">'+text+"</button>"}
function top(kicker,title,desc){return '<div class="topline"><span class="eyebrow">'+kicker+'</span><span class="pill">学校プリント・原典に基づく</span></div><h1 class="page-title">'+title+'</h1><p class="lead">'+desc+'</p>'}
function navTo(name){nav=name;document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===name));render();window.scrollTo({top:0,behavior:"instant"})}
function home(){
 const m=metrics(),pct=Math.round(m.known/m.all*100);
 return top("FOCUSED LEARNING","短い時間で、確実に。","白文からの書き下し・読みを中心に、わかったところを飛ばして苦手だけを繰り返す。")+
 '<div class="notice"><strong>このページは教材原本の照合前です。</strong> 漢詩の原文や訓読は複数の版があります。下の解答を学校で指定された正答として確定しないでください。『史記』・文法演習・コラム・授業書き込みは未収録です。</div>'+
 '<div class="section"><div class="cards"><div class="card"><div class="metriclabel">暗記できた句</div><div class="metric mono">'+m.known+'<span style="font-size:15px;color:#9eabc1"> / '+m.all+'</span></div><div class="progress"><span style="width:'+pct+'%"></span></div><div class="metricmeta">この端末に保存</div></div><div class="card"><div class="metriclabel">もう一度確認</div><div class="metric mono" style="color:#bc761c">'+m.review+'</div><div class="metricmeta">間違えた・自信がない句</div></div><div class="card"><div class="metriclabel">未学習</div><div class="metric mono">'+m.untouched+'</div><div class="metricmeta">まずは一度、白文を見る</div></div></div></div>'+
 '<div class="section"><div class="section-head"><h2 class="section-title">すぐに学習する</h2></div><div class="btnrow">'+button("白文暗記を始める →","goto-recall","primary")+button("苦手だけ演習","weak-test","ghost")+button("試験範囲を確認","goto-scope","")+'</div></div>'+
 '<div class="section"><div class="section-head"><h2 class="section-title">漢詩 5題</h2><span class="helper">全篇は学校資料との照合前</span></div><div class="lesson-grid">'+poems.map(p=>'<button class="lesson" data-poem="'+p.id+'"><span class="tag ready">原文の候補あり</span><div class="lesson-title">'+escapeHTML(p.title)+'</div><div class="smallmeta">'+p.author+' ／ '+p.form+' ／ '+p.lines.length+'句</div></button>').join("")+'</div></div>'+
 '<div class="section"><div class="section-head"><h2 class="section-title">先に確認する重要事項</h2></div><div class="card"><div class="listline"><span class="bullet">1</span><div>白文から書き下しを再現。<strong>読み方も書き下しと同時に覚える。</strong></div></div><div class="listline"><span class="bullet">2</span><div>漢詩の情景・心情を理解。「誰が、どこで、どう感じたか」を一言で説明する。</div></div><div class="listline"><span class="bullet">3</span><div>右下・左下のコラムと授業の手書き事項は、資料受領後に追加する。</div></div></div></div>';
}
function study(){
 const p=poems.find(x=>x.id===current)||poems[0];
 let a=top(mode==="study"?"UNDERSTAND THE TEXT":"ACTIVE RECALL",mode==="study"?"文章の意味をつかむ":"白文だけで思い出す",mode==="study"?"口語訳でもわかりにくいところを、一句ずつ普通の日本語で説明。":"書き下しと読みを頭の中で答えてから、解答を開いて自己判定。");
 a+='<div class="study-switch">'+poems.map(x=>'<button class="'+(x.id===p.id?"active":"")+'" data-poem="'+x.id+'">'+escapeHTML(x.title)+'</button>').join("")+'</div>';
 a+='<div class="study-panel"><div class="poem-head"><div class="eyebrow">'+escapeHTML(p.author)+' ・ '+p.form+'</div><h2>'+escapeHTML(p.title)+'</h2><p>全'+p.lines.length+'句 ／ 原典の異同・訓読は学校教材で要確認</p></div>';
 a+='<div class="blurb"><strong>一言でいうと：</strong> '+escapeHTML(p.topic)+'<br><strong>ポイント：</strong> '+escapeHTML(p.tip)+'</div>';
 a+='<div class="verse-list">'+p.lines.map((l,i)=>{
 const k=p.id+"-"+i,isOpen=mode==="study"?studyRevealed[k]!==false:!!studyRevealed[k],s=status(k);
 let r='<article class="verse '+(isOpen?"open":"")+'"><div class="verse-top"><span class="verse-no">LINE '+String(i+1).padStart(2,"0")+' ／ '+(s===2?"✓ 習得":s===1?"↻ 復習":"未確認")+'</span><button class="link" data-toggle="'+k+'">'+(isOpen?"解答を隠す":"解答を見る")+'</button></div>';
 r+='<p class="kanbun">'+escapeHTML(l[0])+'</p>';
 if(isOpen)r+='<div class="answer"><div class="answer-grid"><div class="answer-label">書き下し（参考・暫定）</div><p class="kakikudashi">'+escapeHTML(l[1])+'</p><div class="answer-label">読み（参考・暫定）</div><p class="reading">'+escapeHTML(l[2])+'</p><div class="answer-label">普通の日本語でいうと</div><div class="translation">'+escapeHTML(l[3])+'</div><div class="answer-label">試験で押さえること</div><p class="plain">'+escapeHTML(l[4])+'</p></div><div class="btnrow verse-actions"><button class="btn green" data-rate="'+k+'" data-score="2">✓ できた</button><button class="btn warn" data-rate="'+k+'" data-score="1">↻ まだ不安</button></div></div>';
 return r+'</article>';
 }).join("")+'</div><p class="helper">出典参考：<a href="'+encodeURI(p.source)+'" target="_blank" rel="noopener noreferrer">古典本文を確認 ↗</a>。読み・訳・ポイントは学習用に編集した暫定解説です。</p></div>';
 return a;
}
function resetTest(weakOnly){
 testQueue=items().filter(x=>!weakOnly||status(x.key)!==2);
 for(let i=testQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[testQueue[i],testQueue[j]]=[testQueue[j],testQueue[i]]}
 testIndex=0;revealed=false;navTo("test");
}
function test(){
 let a=top("PRACTICE","白文・実戦演習","答えを思い出してから開き、「できた」「もう一度」を選択。苦手が自動で記録されます。");
 a+='<div class="btnrow" style="margin-bottom:18px">'+button("全句をランダム出題","new-test","") +button("未習得だけ出題","weak-test","ghost")+'</div>';
 if(!testQueue.length)return a+'<div class="card"><h2>出題する句がありません</h2><p class="helper">新しい演習を開始してください。すべて習得済みなら、全句テストで再確認できます。</p></div>';
 if(testIndex>=testQueue.length)return a+'<div class="test-card"><h2>今回の演習終了</h2><p class="helper">お疲れさまでした。間違えた句は「未習得だけ出題」で復習できます。</p>'+button("苦手だけもう一度","weak-test","primary")+'</div>';
 const x=testQueue[testIndex],p=x.p,l=x.l;
 a+='<div class="test-card"><div class="section-head"><span class="eyebrow">'+escapeHTML(p.title)+' / '+escapeHTML(p.author)+'</span><span class="helper mono">'+(testIndex+1)+' / '+testQueue.length+'</span></div><div class="progress"><span style="width:'+Math.round(testIndex/testQueue.length*100)+'%"></span></div><div class="prompt-title" style="margin-top:26px">白文から書き下し・読みを再現</div><div class="test-kanbun">'+escapeHTML(l[0])+'</div>';
 if(revealed)a+='<div class="test-answer"><div class="answer-label">書き下し（暫定）</div><strong>'+escapeHTML(l[1])+'</strong><div class="answer-label" style="margin-top:14px">読み（暫定）</div>'+escapeHTML(l[2])+'<div class="answer-label" style="margin-top:14px">意味</div>'+escapeHTML(l[3])+'</div><div class="btnrow" style="margin-top:19px"><button class="btn green" data-testscore="2">✓ 正解・次へ</button><button class="btn warn" data-testscore="1">↻ 不正解・次へ</button></div>';
 else a+='<div class="btnrow" style="justify-content:center">'+button("書き下し・読みを表示","reveal","primary")+'</div>';
 a+='</div><p class="helper">完全自動採点ではありません。思い出した答えと参考解答を比べて、自己採点してください。</p>';
 return a;
}
function scopeView(){
 let a=top("OFFICIAL SCOPE","先生の指定した試験範囲","出題範囲は先生のコメントに基づいて記載。未提供の資料は必ず未収録と明示しています。");
 a+='<div class="notice"><strong>最重要：</strong> 本文は白文で出題。『体系漢文法演習』は本文12〜17だけでなく右下・左下も範囲。授業中の書き込み・漢文知識も対象。初見は少量。</div>';
 a+='<div class="section"><h2 class="section-title">網羅状況</h2><div class="card" style="margin-top:12px">'+scope.map((s,i)=>'<div class="listline"><span class="bullet">'+(i+1)+'</span><div><strong>'+escapeHTML(s[0])+'</strong><div class="smallmeta">'+escapeHTML(s[1])+'</div></div></div>').join("")+'</div></div>';
 a+='<div class="section"><h2 class="section-title">教材を完成させるために必要なもの</h2><div class="card" style="margin-top:12px"><p class="plain">①『史記会注考証』の指定ページ、②『体系漢文法演習』12〜17の本文と左右下のコラム、③授業プリントの手書き箇所、④漢詩の教科書本文（特に秋浦歌の何首か・燕子楼の異文）を確認します。資料到着後に対応する箇所を置き換えます。</p></div></div>';
 a+='<div class="section"><h2 class="section-title">学習履歴の管理</h2><div class="btnrow" style="margin-top:12px">'+button("履歴をJSONで保存","export","")+button("履歴を読み込む","import","")+button("端末の履歴を初期化","reset","warn")+'</div><input type="file" accept="application/json,.json" id="import-input" class="hidden"><p class="helper">端末のブラウザ保存領域を使用。プライベートモードやブラウザデータ削除で消える可能性があります。JSONバックアップ推奨。</p></div>';
 a+='<div class="section"><h2 class="section-title">古典本文の参照先</h2><div class="card" style="margin-top:12px">'+poems.map(p=>'<div class="listline"><span class="bullet">↗</span><div><a href="'+encodeURI(p.source)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(p.author)+'『'+escapeHTML(p.title)+'』</a></div></div>').join("")+'</div></div>';
 return a;
}
function render(){document.getElementById("view").innerHTML=nav==="home"?home():nav==="study"||nav==="recall"?study():nav==="test"?test():scopeView();}
document.addEventListener("click",e=>{
 const el=e.target.closest("button");if(!el)return;
 if(el.dataset.nav){mode=el.dataset.nav==="recall"?"recall":"study";navTo(el.dataset.nav);return;}
 if(el.dataset.poem){current=el.dataset.poem;studyRevealed={};navTo(mode==="recall"?"recall":"study");return;}
 if(el.dataset.toggle){const k=el.dataset.toggle;const isOpen=mode==="study"?studyRevealed[k]!==false:!!studyRevealed[k];studyRevealed[k]=!isOpen;render();return;}
 if(el.dataset.rate){state.scores[el.dataset.rate]=Number(el.dataset.score);save();render();return;}
 if(el.dataset.testscore){state.scores[testQueue[testIndex].key]=Number(el.dataset.testscore);save();testIndex++;revealed=false;render();return;}
 const act=el.dataset.act;
 if(act==="goto-recall"){mode="recall";navTo("recall")}
 if(act==="goto-scope")navTo("scope");
 if(act==="reveal"){revealed=true;render()}
 if(act==="new-test")resetTest(false);
 if(act==="weak-test")resetTest(true);
 if(act==="reset"&&confirm("この端末の学習履歴を削除します。よろしいですか？")){state={scores:{},factScores:{}};save();render()}
 if(act==="export"){
 const blob=new Blob([JSON.stringify({version:2,scores:state.scores,factScores:state.factScores,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="kanbun-study-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
 }
 if(act==="import")document.getElementById("import-input")?.click();
});
document.addEventListener("change",async e=>{
 if(e.target.id!=="import-input"||!e.target.files?.[0])return;
 try{let d=JSON.parse(await e.target.files[0].text());if(!d||![1,2].includes(d.version)||!d.scores||typeof d.scores!=="object"||Array.isArray(d.scores))throw Error();
 let allowed=new Set(items().map(x=>x.key)),scores={};
 for(const [k,v] of Object.entries(d.scores)){if(allowed.has(k)&&[0,1,2].includes(v))scores[k]=v;}
 state.scores=scores;state.factScores=(d.factScores&&typeof d.factScores==="object")?Object.fromEntries(Object.entries(d.factScores).filter(([k,v])=>/^[0-9]+$/.test(k)&&Number(k)<window.KANBUN_FACTS.length&&[0,1,2].includes(v))):{};save();alert("学習履歴を読み込みました。");render();}
 catch{alert("形式が正しいバックアップではありません。");}finally{e.target.value="";}
});
resetTest(false);navTo("home");
</script>
<script src="./enhancements.js"></script>
