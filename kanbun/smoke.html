<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Kanbun browser regression test</title></head>
<body><h1>Kanbun app browser tests</h1><pre id="result">RUNNING</pre><iframe id="frame" src="./index.html" width="940" height="700" title="app under test"></iframe>
<script>
const out=document.getElementById("result"),frame=document.getElementById("frame");
frame.addEventListener("load",()=>{
 const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name);};
 try{
 const win=frame.contentWindow,doc=frame.contentDocument;
 const dom=()=>doc.body.textContent,click=(selector)=>{const b=doc.querySelector(selector);if(!b)throw Error("Missing control: "+selector);b.click();};
 const info=win.__KANBUN_DIAGNOSTICS__;
 check("App renders with pink theme",!!doc.querySelector(".layout")&&!!info&&win.getComputedStyle(doc.documentElement).getPropertyValue("--primary").trim()==="#b82e72");
 check("Twelve lessons on home",doc.querySelectorAll(".lesson-card").length===12);
 check("Correct total across lines, facts and columns",info.count()===161&&JSON.stringify(info.kinds())===JSON.stringify({line:104,column:6,fact:51}));
 click('[data-act="all"]');check("Full-course mode starts and includes every item",info.session().length===161&&info.session().pos===0&&win.location.hash==="#session");
 click('[data-act="reveal"]');check("Reveal marks opened item as pending review",!!doc.querySelector(".answer")&&info.totals().weak===1);
 click('[data-act="grade"][data-score="2"]');check("Pass advances and persists",info.session().pos===1&&info.totals().done===1);
 click('[data-act="reveal"]');click('[data-act="grade"][data-score="1"]');
 check("Incorrect answer advances and is remembered",info.session().pos===2&&info.totals().weak===1);
 click('[data-act="weak"]');check("Weak-only uses only failed item",info.session().mode==="weak"&&info.session().length===1);
 click('[data-act="reveal"]');click('[data-act="grade"][data-score="2"]');
 check("Correcting weak item removes it from weak list",info.totals().weak===0&&info.session().pos===1);
 click('[data-act="nav"][data-to="home"]');click('[data-act="unfinished"]');
 check("Unfinished mode excludes mastered items",info.session().length===159);
 click('[data-act="nav"][data-to="lesson"]');check("Shiji lesson loads in study mode",doc.querySelectorAll(".verse").length===23);
 click('[data-act="nav"][data-to="knowledge"]');
 check("Knowledge and column coverage is visible",doc.querySelectorAll(".column").length===6&&doc.querySelectorAll(".verse").length===51);
 out.textContent="PASS 12 / 12\n"+checks.map(x=>"✓ "+x.name).join("\n");
 }catch(e){out.textContent="FAIL "+checks.filter(x=>x.pass).length+" / 12\n"+checks.map(x=>x.pass?"✓ "+x.name:"✗ "+x.name).join("\n")+"\n"+String(e)+"\n"+(e.stack||"");}
});
</script></body></html>
