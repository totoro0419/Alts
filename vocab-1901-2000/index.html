lse">${n}</button>`).join('');$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=+b.dataset.cat;$('#q').value='';render()};$('#q').oninput=render;$('#top').onclick=()=>{only=!only;render()};$('#hide').onclick=()=>{hide=!hide;shown.clear();render()};$('#out').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;shown.has(k)?shown.delete(k):shown.add(k);render();document.querySelector(`[data-k="${k}"]`)?.focus()};render();
