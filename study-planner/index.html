const dates=seed.map((d,i)=>({label:d[0],note:d[1],iso:i<4?'2026-11-'+(27+i):'2026-12-'+String(i-3).padStart(2,'0')}));

let day=todayIndex(),view='day',editing=null;

function renderSummary(){const ts=state.tasks,done=ts.filter(t=>t.done),m=sum(ts);$('summary').replaceChildren();[['計画時間',fmt(m)],['完了',done.length+' / '+ts.length],['実測時間',fmt(Math.floor(sum(ts,'actual')/60))]].forEach(([l,v])=>{let p=el('div','metric');p.append(el('div','muted',l),el('strong','',v));$('summary').append(p)});$('progress').style.width=(m?sum(done)/m*100:0)+'%'}
function makeDay(i,print=false){let d=dates[i],ts=state.tasks.filter(t=>t.day===i),wrap=el('section','day'+(d.note.startsWith('午前試験')?' exam':d.note==='終日休み'?' sunday':''));let h=el('div','day-head'),left=el('div');left.append(el('div','date',d.label),el('div','muted',d.note));h.append(left,el('div','time',fmt(sum(ts))));wrap.append(h);ts.forEach((t,j)=>{let row=el('div','task'+(t.done?' done':'')),check=el('input');check.type='checkbox';check.checked=t.done;check.id=(print?'p-':'s-')+t.id;check.setAttribute('aria-label',t.subject+' '+t.desc);if(print)check.tabIndex=-1;check.addEventListener('change',()=>{t.done=check.checked;save();render()});let label=el('label');label.htmlFor=check.id;label.append(el('span','subject',t.subject),el('span','desc','→ '+t.desc));let actions=el('div','task-actions');actions.append(el('span','duration',fmt(t.min)));if(!print){if(t.actual>0)actions.append(el('span','muted','実測 '+fmt(Math.floor(t.actual/60))));actions.append(btn('編集',()=>openEditor(t.id,i)));let up=btn('↑',()=>moveOrder(t.id,-1));up.setAttribute('aria-label','上へ移動');up.disabled=j===0;actions.append(up)}row.append(check,label,actions);wrap.append(row)});if(!ts.length)wrap.append(el('div','finish',i===12?'期末試験終了！':'予定なし'));if(!print){let f=el('div','day-footer');f.append(el('span','',ts.filter(t=>t.done).length+' / '+ts.length+' 完了'),btn('＋ 予定追加',()=>openEditor(null,i)));wrap.append(f)}return wrap}

function render(){renderSummary();const root=$('screen');root.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(view==='day'){let n=el('div','day-nav'),prev=btn('‹ 前日',()=>{day--;render()}),next=btn('翌日 ›',()=>{day++;render()}),s=el('select');s.setAttribute('aria-label','日付');options(s,dates.map((d,i)=>[i,d.label]),day);s.onchange=()=>{day=Number(s.value);render()};prev.disabled=day===0;next.disabled=day===dates.length-1;n.append(prev,s,next);root.append(n,makeDay(day))}else if(view==='all'){dates.forEach((_,i)=>root.append(makeDay(i)))}else if(view==='stats'){let panel=el('section','panel');panel.append(el('h2','','科目別進捗'));for(const subject of [...new Set(state.tasks.map(t=>t.subject))]){const ts=state.tasks.filter(t=>t.subject===subject),m=sum(ts),done=sum(ts.filter(t=>t.done));let r=el('div','bar-row'),track=el('div','track'),fill=el('span');fill.style.width=(m?done/m*100:0)+'%';track.append(fill);r.append(el('span','',subject),track,el('span','num',fmt(done)+' / '+fmt(m)));panel.append(r)}root.append(panel)}else{let p=el('section','panel settings');p.append(el('h2','','データ管理'),el('p','muted','進捗と変更はこのブラウザー内に保存されます。端末間の同期はありません。'),btn('バックアップ出力',exportData),btn('バックアップ読込',()=>{const f=el('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let obj=JSON.parse(await f.files[0].text());if(!Array.isArray(obj.tasks)||!obj.tasks.every(validTask)||new Set(obj.tasks.map(t=>t.id)).size!==obj.tasks.length)throw Error();if(confirm('現在の予定をバックアップで置き換えますか？')){state={tasks:obj.tasks,timer:null};save();render()}}catch(e){alert('読み込めないファイルです。')}};f.click()}),btn('初期計画に戻す',()=>{if(confirm('変更・進捗をすべて初期化しますか？')){state=fresh();save();render()}},'danger'));root.append(p)}let grid=el('div','print-grid'),a=el('div'),b=el('div');dates.forEach((_,i)=>(i<7?a:b).append(makeDay(i,true)));grid.append(a,b);$('printArea').replaceChildren(grid,el('p','print-foot','時間は目安。①②は別の学習ブロック。 $('cancel').onclick=()=>$('editor').close();
$('delete').onclick=()=>{if(confirm('この予定を削除しますか？')){state.tasks=state.tasks.filter(t=>t.id!==editing);if(state.timer?.id===editing)state.timer=null;$('editor').close();save();render()}};
$('split').onclick=()=>{let t=state.tasks.find(t=>t.id===editing);if(!t||!$('editForm').reportValidity())return;let v=editValues();if(v.min<2)return;if(state.timer?.id===editing){alert('先にタイマーを記録してください。');return}if((t.done||t.actual)&&!confirm('分割後は未完了に戻します。実測時間は①に残します。よろしいですか？'))return;let index=state.tasks.indexOf(t),first=Math.ceil(v.min/2);Object.assign(t,v,{desc:v.desc+' ①',min:first,done:false});state.tasks.splice(index+1,0,{...v,id:uid(),desc:v.desc+' ②',min:v.min-first,done:false,actual:0});$('editor').close();save();render()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('today').onclick=()=>{view='day';day=todayIndex();render()};$('print').onclick=()=>window.print();
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify({tasks:state.tasks},null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='study-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function renderTimerOptions(){let current=state.timer?.id||$('timerTask').value;let ts=state.tasks.filter(t=>!t.done||t.id===current);options($('timerTask'),ts.map(t=>[t.id,dates[t.day].label+' '+t.subject+' '+t.desc]),ts.some(t=>t.id===current)?current:ts.find(t=>t.day===day)?.id||ts[0]?.id);$('timerTask').disabled=!!state.timer;$('timerStart').disabled=!state.timer&&!ts.length}
function elapsed(){let t=state.timer;return t?Math.max(0,t.elapsed+(t.started===null?0:Math.floor((Date.now()-t.started)/1000))):0}
function tick(){let s=elapsed();$('clock').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');$('timerStart').textContent=state.timer?.started!=null?'一時停止':state.timer?'再開':'開始';$('timerSave').disabled=!state.timer}
$('timerStart').onclick=()=>{if(!state.timer){if(!$('timerTask').value)return;state.timer={id:$('timerTask').value,elapsed:0,started:Date.now()}}else if(state.timer.started!==null){state.timer.elapsed=elapsed();state.timer.started=null}else state.timer.started=Date.now();save();renderTimerOptions();tick()};
$('timerSave').onclick=()=>{if(!state.timer)return;let t=state.tasks.find(t=>t.id===state.timer.id);if(t)t.actual+=elapsed();state.timer=null;save();render()};setInterval(tick,1000);
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{notice='オフライン準備ができませんでした。';$('notice').textContent=notice});
</script></body></html>
