 for(const c of planChanges){const t=obj.tasks.find(t=>t.id===c.id);if(t&&!t.done&&t.day===c.day&&t.subject===c.old[0]&&t.desc===c.old[1]&&t.min===c.old[2])Object.assign(t,{desc:c.desc,min:c.min})}

}

let day=todayIndex(),view='day',editing=null,spanDays=3;
