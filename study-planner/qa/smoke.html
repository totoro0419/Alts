<!doctype html><html lang="ja"><meta charset="utf-8"><title>Planner UI QA</title><pre id="result">RUNNING</pre><script>
(async()=>{
if(!['localhost','127.0.0.1'].includes(location.hostname)){document.querySelector('#result').textContent='Local QA only';return;}
const output=document.querySelector('#result'),results=[];const check=(label,ok)=>{results.push((ok?'PASS ':'FAIL ')+label);if(!ok)throw new Error(label)};
const frame=document.createElement('iframe');frame.style.cssText='border:0;display:block';document.body.append(frame);
const load=()=>new Promise((resolve,reject)=>{frame.onload=()=>resolve(frame.contentDocument);frame.onerror=reject;frame.src='./index.html?qa=layout'});
const key='sideworks:study-planner:v1';
try{
localStorage.removeItem(key);
for(const [width,height] of [[777,1164],[1164,777],[800,600],[390,844]]){
frame.style.width=width+'px';frame.style.height=height+'px';
let doc=await load(),win=frame.contentWindow;const qs=s=>doc.querySelector(s);const selected=qs('.day-nav select');check(width+'x'+height+' date navigation',selected.options.length===13);
let fits=0,maxOverflow=0;
for(let day=0;day<13;day++){
const select=qs('.day-nav select');select.value=String(day);select.dispatchEvent(new win.Event('change',{bubbles:true}));
const bottom=qs('#screen .day').getBoundingClientRect().bottom,top=win.innerHeight;
maxOverflow=Math.max(maxOverflow,bottom-top);if(bottom<=top+1)fits++;
check(width+'x'+height+' day '+(day+1)+' no horizontal overflow',doc.documentElement.scrollWidth<=win.innerWidth+1);
const controls=[...doc.querySelectorAll('header button,.nav button,.day-nav button,.day-nav select,#screen .task input,#screen .task-actions button,#screen .day-footer button')];check(width+'x'+height+' day '+(day+1)+' controls at least 48x48',controls.every(el=>{const r=el.getBoundingClientRect();return r.width>=47.9&&r.height>=47.9}));
}
if(width===777||width===1164)check(width+'x'+height+' all 13 days fit within viewport (max overflow '+Math.round(maxOverflow)+'px)',fits===13);
else results.push('INFO '+width+'x'+height+' '+fits+'/13 fit, max overflow '+Math.round(maxOverflow)+'px; normal vertical scroll allowed');
qs('[data-view="multi"]').click();check(width+'x'+height+' multi no horizontal overflow',doc.documentElement.scrollWidth<=win.innerWidth+1);qs('[data-view="day"]').click();
if(width===777){
let select=qs('.day-nav select');select.value='2';select.dispatchEvent(new win.Event('change',{bubbles:true}));
const before=qs('#summary').textContent;const checkbox=qs('#screen .task input');checkbox.click();check('checkbox updates completion',qs('#summary').textContent!==before&&qs('#screen .task input').checked);
let stored=JSON.parse(localStorage.getItem(key));check('checkbox persisted',stored.tasks.some(t=>t.id==='t2-0'&&t.done));
doc=await load();let sel=qs('.day-nav select');sel.value='2';sel.dispatchEvent(new win.Event('change',{bubbles:true}));check('completion survives refresh',qs('#screen .task input').checked);
qs('#screen .task-actions button').click();check('edit dialog opens',qs('#editor').open);qs('#editMin').value='151';qs('#editForm').requestSubmit();check('edit saves duration',JSON.parse(localStorage.getItem(key)).tasks.some(t=>t.id==='t2-0'&&t.min===151));
check('timer removed',!qs('.timer')&&!qs('#timerStart')&&!qs('#timerTask'));check('print feature removed',!qs('#print')&&!qs('#printArea'));
check('remaining time shown',qs('#summary').textContent.includes('残り時間'));
qs('[data-view="stats"]').click();check('stats accessible',qs('#screen .bar-row')!==null);
qs('[data-view="multi"]').click();check('multi default three days',doc.querySelectorAll('#screen .day').length===3);
qs('[aria-label="表示日数"]').value='5';qs('[aria-label="表示日数"]').dispatchEvent(new win.Event('change',{bubbles:true}));check('multi five days',doc.querySelectorAll('#screen .day').length===5);
qs('#screen .day-footer button').click();check('overview opens daily view',doc.querySelectorAll('#screen .day').length===1);
qs('[data-view="all"]').click();check('all dates accessible',doc.querySelectorAll('#screen .day').length===13);
check('review rounds are present',doc.querySelector('#screen').textContent.includes('×だけ2周目')&&doc.querySelector('#screen').textContent.includes('4周目'));
const prior=JSON.parse(localStorage.getItem(key));delete prior.planVersion;prior.tasks=prior.tasks.filter(t=>!['t5-5','t10-5'].includes(t.id));const original=prior.tasks.find(t=>t.id==='t1-3');original.desc='漢字100熟語';original.min=30;const custom=prior.tasks.find(t=>t.id==='t2-3');custom.desc='自分の変更';localStorage.setItem(key,JSON.stringify(prior));doc=await load();const migrated=JSON.parse(localStorage.getItem(key));check('legacy migration preserves completed and custom tasks',migrated.tasks.some(t=>t.id==='t2-0'&&t.done&&t.min===151)&&migrated.tasks.some(t=>t.id==='t2-3'&&t.desc==='自分の変更'));check('legacy untouched review updated',migrated.tasks.some(t=>t.id==='t1-3'&&t.desc.includes('1周目')));check('new review tasks added once',migrated.tasks.filter(t=>['t5-5','t10-5'].includes(t.id)).length===2);
const v2=JSON.parse(localStorage.getItem(key));v2.planVersion=2;v2.tasks=v2.tasks.filter(t=>!['t6-5','t6-6'].includes(t.id));const m=v2.tasks.find(t=>t.id==='t6-0');m.desc="プリント・苦手問題の確認";m.min=30;localStorage.setItem(key,JSON.stringify(v2));doc=await load();const v3=JSON.parse(localStorage.getItem(key));check('holiday migration preserves prior progress',v3.tasks.some(t=>t.id==='t2-0'&&t.done&&t.min===151));check('holiday tasks added once',v3.tasks.filter(t=>['t6-5','t6-6'].includes(t.id)).length===2&&v3.tasks.some(t=>t.id==='t6-0'&&t.min===60));const holiday=qs('.day-nav select');holiday.value='6';holiday.dispatchEvent(new win.Event('change',{bubbles:true}));check('holiday label and 8h30 plan',qs('#screen .day').textContent.includes('全休・試験前日')&&qs('#screen .day .time').textContent==='8h 30m');
const oldv3=JSON.parse(localStorage.getItem(key));oldv3.planVersion=3;const phys=oldv3.tasks.find(t=>t.id==='t6-1');phys.desc="① レンズ・公式・苦手問題の解き直し";const jp=oldv3.tasks.find(t=>t.id==='t8-4');jp.desc="日本史：×だけ2周目（全範囲）";jp.done=true;const copy={...jp,id:'qa-duplicate',done:false};oldv3.tasks.push(copy);localStorage.setItem(key,JSON.stringify(oldv3));doc=await load();let v4=JSON.parse(localStorage.getItem(key));check('scope migration changes only untouched tasks',v4.planVersion===4&&v4.tasks.some(t=>t.id==='t6-1'&&t.desc.includes('作図'))&&v4.tasks.some(t=>t.id==='t8-4'&&t.done&&t.desc==="日本史：×だけ2周目（全範囲）")&&v4.tasks.some(t=>t.id==='t2-0'&&t.done&&t.min===151));
qs('[data-view="all"]').click();check('no redundant subject prefixes', [...doc.querySelectorAll('#screen .task')].every(row=>!row.querySelector('.desc').textContent.startsWith('→ '+row.querySelector('.subject').textContent+'：')));
qs('[data-view="settings"]').click();const merge=[...doc.querySelectorAll('#screen button')].find(b=>b.textContent==='重複予定を整理');check('duplicate recovery available',!!merge);win.confirm=()=>true;merge.click();v4=JSON.parse(localStorage.getItem(key));check('duplicate cleanup preserves completed record',v4.tasks.some(t=>t.id==='t8-4'&&t.done)&&!v4.tasks.some(t=>t.id==='qa-duplicate'));doc=await load();check('cleanup survives reload',!JSON.parse(localStorage.getItem(key)).tasks.some(t=>t.id==='qa-duplicate'));
localStorage.removeItem(key);
}
}
output.textContent='PASS\n'+results.join('\n');
}catch(e){output.textContent='FAIL '+e.message+'\n'+results.join('\n')}finally{localStorage.removeItem(key)}
})();
</script></html>
