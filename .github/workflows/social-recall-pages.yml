name: Publish Social Recall

on:
  push:
    branches: [main]
    paths:
      - 'social-recall/**'
      - '.github/workflows/social-recall-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Social Recall
        shell: bash
        run: |
          set -euo pipefail
          test -f social-recall/index.html
          test -f social-recall/assets/app.css
          test -f social-recall/assets/app.js
          test -f social-recall/assets/data.json
          node --check social-recall/assets/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('social-recall/assets/data.json').read_text())
          token_list=[t for c in data['chapters'] for s in c['sections'] for p in s['paragraphs'] for t in p['tokens'] if 'answer' in t]
          assert len(token_list)==data['counts']['total']
          assert len({t['id'] for t in token_list})==len(token_list)
          assert all(t['level'] in (1,2,3) for t in token_list)
          for chapter in data['chapters']:
              for section in chapter['sections']:
                  for p in section['paragraphs']:
                      assert section['pageStart'] <= p['page'] <= section['pageEnd']
          print('Validated',len(token_list),'recall targets')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete Sideworks site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Social Recall URL and assets
        shell: bash
        run: |
          set -euo pipefail
          URL="https://totoro0419.github.io/Alts/social-recall/"
          ok=0
          for attempt in {1..15}; do
            if curl --fail --location --silent --show-error --max-time 15 "${URL}" -o /tmp/social-recall-page.html && grep -q 'Social Recall' /tmp/social-recall-page.html; then
              ok=1
              break
            fi
            echo "Live URL not yet ready (attempt ${attempt}/15)"
            sleep 6
          done
          test "${ok}" -eq 1
          for asset in "assets/app.css" "assets/app.js" "assets/data.json"; do
            curl --fail --location --silent --show-error --max-time 15 "${URL}${asset}" -o /tmp/social-recall-asset
            test -s /tmp/social-recall-asset
            echo "LIVE verified: ${asset}"
          done
          curl --fail --location --silent --show-error --max-time 15 "${URL}" | grep -q "Social Recall"
          echo "LIVE verified: ${URL} (including a second direct request)"
