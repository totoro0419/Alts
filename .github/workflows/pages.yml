name: Publish Kanbun Study

on:
  push:
    branches: [main]
    paths:
      - 'kanbun/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify study UI and project-scoped PWA in Chrome
        shell: bash
        run: |
          set -euo pipefail
          SITE_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          test -f "$SITE_ROOT/Alts/kanbun/index.html"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$SITE_ROOT" >/tmp/kanbun-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Headless Chrome is unavailable"
            exit 1
          fi
          for SPEC in "smoke.html:PASS 13 / 13"; do
            PAGE="${SPEC%%:*}"
            EXPECT="${SPEC#*:}"
            OUTPUT="/tmp/kanbun-${PAGE}.dom"
            timeout 75 "$BROWSER" --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --no-first-run --disable-background-networking \
              --virtual-time-budget=17000 --dump-dom \
              "http://127.0.0.1:8765/Alts/kanbun/$PAGE" \
              >"$OUTPUT" 2>"/tmp/kanbun-${PAGE}.err" || true
            RESULT="$(python3 -c 'import re,sys,html; s=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"<pre id=.result.>([^<]*)</pre>",s); print(html.unescape(m.group(1)).splitlines()[0].strip() if m else "MISSING")' "$OUTPUT")"
            echo "Browser result: $RESULT"
            if [[ "$RESULT" != "$EXPECT" ]]; then
              echo "::error::Failed $PAGE; blocking publication"
              grep -A 20 -B 2 '<pre id="result">' "$OUTPUT" || true
              tail -35 "/tmp/kanbun-${PAGE}.err" || true
              exit 1
            fi
            echo "Verified $PAGE: $EXPECT"
          done
          python3 kanbun/pwa-audit.py http://127.0.0.1:8765/Alts/kanbun/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
