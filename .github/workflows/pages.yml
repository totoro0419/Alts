name: Publish Kanbun Study

on:
  push:
    branches: [main]
    paths:
      - 'kanbun/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify full study UI in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kanbun-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Headless Chrome is unavailable"
            exit 1
          fi
          timeout 60 "$BROWSER" --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --no-first-run --disable-background-networking \
            --virtual-time-budget=9000 --dump-dom \
            "http://127.0.0.1:8765/kanbun/smoke.html" \
            > /tmp/kanbun-smoke-dom.html 2>/tmp/kanbun-chrome.err || true
          grep -o 'PASS [0-9]* / [0-9]*' /tmp/kanbun-smoke-dom.html || true
          if ! grep -q 'PASS 12 / 12' /tmp/kanbun-smoke-dom.html; then
            echo "::error::Study app UI failed the real-browser smoke test; preventing publication"
            grep -A 25 -B 2 '<pre id="result">' /tmp/kanbun-smoke-dom.html || true
            tail -40 /tmp/kanbun-chrome.err || true
            exit 1
          fi
          echo "12 UI assertions passed in headless Chrome"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
