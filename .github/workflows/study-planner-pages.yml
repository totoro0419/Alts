name: Publish Study Planner

on:
  push:
    branches: [main]
    paths:
      - 'study-planner/**'
      - '.github/workflows/study-planner-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://totoro0419.github.io/Alts/study-planner/
    steps:
      - uses: actions/checkout@v4
      - name: Validate study planner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('study-planner')
          html=(p/'index.html').read_text()
          data=json.loads(re.search(r'const seed=(.*);\nconst dates=',html).group(1))
          assert len(data)==13 and sum(len(d[2]) for d in data)==66
          assert sum(t[2] for d in data for t in d[2])==4950
          keys=[(i,*t) for i,d in enumerate(data) for t in d[2]]
          assert len(keys)==len(set(keys)), 'duplicate seed tasks'
          assert all(not t[1].startswith(t[0]+'：') for d in data for t in d[2]), 'redundant subject prefix'
          history=json.loads((p/'qa/history-video-plan.json').read_text())
          assert [v['number'] for v in history['lectures']]==list(range(63,89))
          assert [k for g in history['groups'] for k in range(g['start'],g['end']+1)]==list(range(65,89))
          assert sum(g['seconds'] for g in history['groups'])==sum(v['seconds'] for v in history['lectures'] if v['number']>=65)==40452
          for g in history['groups']:
              assert g['video']==(g['seconds']+119)//120 and g['min']==g['video']+g['memorize']
              assert data[g['day']][2][g['j']][0]=='日本史' and data[g['day']][2][g['j']][2]==g['min']
          manifest=json.loads((p/'manifest.webmanifest').read_text())
          assert manifest['scope']==manifest['start_url']=='./'
          assert all((p/i['src']).is_file() for i in manifest['icons'])
          Path('/tmp/study-planner.js').write_text(re.search(r'<script>(.*?)</script>',html,re.S).group(1))
          PY
          node --check /tmp/study-planner.js
          node --check study-planner/sw.js
          SITE_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$SITE_ROOT" >/tmp/planner-http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium)"
          timeout 45 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=2500 --dump-dom http://127.0.0.1:8765/Alts/study-planner/ >/tmp/planner-dom.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/planner-dom.html').read_text()
          assert '<section class="day' in s
          assert '66</strong>' in s
          assert '<div class="task' in s
          print('Planner rendered successfully')
          PY
      - name: Tablet layout and interaction regression
        shell: bash
        run: |
          set -euo pipefail
          SITE_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          cp study-planner/qa/smoke.html study-planner/.ui-smoke.html
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$SITE_ROOT" >/tmp/planner-ui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f study-planner/.ui-smoke.html' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium)"
          timeout 50 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1400,1300 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8766/Alts/study-planner/.ui-smoke.html >/tmp/planner-ui-dom.html
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          s=Path('/tmp/planner-ui-dom.html').read_text()
          m=re.search(r'<pre id="result">(.*?)</pre>',s,re.S)
          assert m, 'Missing QA result'
          result=html.unescape(m.group(1))
          print(result)
          assert result.startswith('PASS\n'), result
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Confirm artifact is visible to Pages API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              echo "Pages artifact available"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public URL and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://totoro0419.github.io/Alts/study-planner/"
          for attempt in {1..15}; do
            ok=1
            for f in index.html manifest.webmanifest sw.js icon.svg; do
              if ! curl -fsSL --max-time 15 "${base}${f}" -o "/tmp/planner-live-${f}" || ! cmp -s "study-planner/${f}" "/tmp/planner-live-${f}"; then
                ok=0
                break
              fi
            done
            if [ "$ok" = 1 ] && curl -fsSL --max-time 15 "$base" -o /tmp/planner-live-root && cmp -s study-planner/index.html /tmp/planner-live-root; then
              echo "LIVE verified: $base"
              exit 0
            fi
            sleep 5
          done
          exit 1
