<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sideworks</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: light-dark(#f9fafc,#10141e); color: light-dark(#202737,#e6eaf4); }
    main { padding: 2rem; width: min(34rem, 100%); box-sizing: border-box; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.035em; margin: 0 0 1rem; }
    p { line-height: 1.8; font-size: .95rem; color: light-dark(#586275,#a5afc0); }
    code { font-size: .94em; word-break: break-word; }
  </style>
</head>
<body>
  <main>
    <h1>Sideworks</h1>
    <p>独立したページ・ツール・学習資料を、それぞれのURLパスで公開しています。</p>
    <p>このルートはメインアプリではありません。各コンテンツのURL（<code>/Alts/&lt;slug&gt;/</code>）へ直接アクセスしてください。</p>
  </main>
</body>
</html>
